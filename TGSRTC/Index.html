                <input type="text" id="fn" placeholder=""required > <br><br>

                <input type="date"id="dob" required>
                <label for="">Gender</label>
                <input type="radio" value="male" id="gr" name="gr" required>
                <label for="gr">Male</label>
                <input type="radio" id="gr1" value="famale" name="gr" required>
                <label for="gr1">Female</label><br><br>
                <label for="">Age As on:<span style="color:red">*</span></label>

                <label for="ys">Year(s)</label>
                <input type="text"id="ms" maxlength="2"style="width: 25px;" required>
                <label for="ms">Month(s)</label>
                <input type="text"id="ds" maxlength="2"style="width: 25px;" required>
                <label for="ds">Day(s)</label>

                <br><br>

                <label for="El">Email Id</label>

                    <option value="KarimNagar">KarimNagar</option>

                    <option value="KarimNagar">KarimNagar</option>
                    <option value="Medak">Medak</option>

                <legend style="background-color: rgb(53, 162, 221); border-radius: 5px;"><h3>Mode Of Payment & Pass Collection</h3></legend>

                You want to collect
